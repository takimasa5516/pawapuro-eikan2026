打（一発被弾）を浴びやすくなる。`,note:`栄冠ナインの投手の事故敗戦ナンバーワン要因。「逃げ球」で確実に上書き消去しましょう。`},{id:3,redName:`軽い球`,blueName:`重い球`,goldName:`怪物球威`,category:`投手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`打球が異常に伸びてフェンスオーバーされやすくなる。`,note:`球速が高くてもスタンドに運ばれる危険性大。「重い球」の取得で上書き消去可能。`},{id:4,redName:`負け運`,blueName:`勝ち運`,goldName:`勝利の星`,category:`投手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`登板中、味方打線全体のパワーが下がり得点力が劇的に落ちる。`,note:`投手が好投しても0-1で競り負ける典型例。「勝ち運」で上書き消去できます。`},{id:5,redName:`送球× (E〜G)`,blueName:`送球○/◎`,goldName:`ストライク送球`,category:`野手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`送球コントロールが大きく乱れ、悪送球エラーを連発する。`,note:`特に捕手や二塁・遊撃手にあると致命的。特別指導の「守備」で最優先消去推奨。`},{id:6,redName:`キャッチャー× (E〜G)`,blueName:`キャッチャー○/B/A`,goldName:`球界の頭脳`,category:`捕手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`投手のコントロールが著しく低下し、消費スタミナが激増する。`,note:`この捕手がマスクを被ると投手陣が壊滅します。特能の本等で直ちに消去・上書き必須。`},{id:7,redName:`エラー`,blueName:`守備職人`,goldName:`魔術師`,category:`野手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`重要な局面やイージーゴロ・フライでファンブルや落球を犯す。`,note:`9回裏のサヨナラ負けエラーに直結。捕球特訓や守備職人の取得で解消。`},{id:8,redName:`寸前×`,blueName:`尻上がり`,goldName:`終盤の鬼`,category:`投手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`5回や9回など、勝利目前のイニングで急激に能力が落ちて連打を浴びる。`,note:`9回2アウトから大逆転される悲劇の元凶。「尻上がり」で解消可能です。`},{id:9,redName:`四球`,blueName:`コントロール特訓`,goldName:`精密機械`,category:`投手`,dangerLevel:`最凶`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`カウント3ボールになるとコントロールが急激に悪化し押し出し四球等を連発。`,note:`自滅炎上の引き金。制球練習と特訓で早期消去が望ましいです。`},{id:10,redName:`スロースターター`,blueName:`立ち上がり○`,goldName:`快速立ち上がり`,category:`投手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`序盤（1〜2回）に失点しやすくなる。`,note:`「立ち上がり○」を取得することで上書き消去可能です。`},{id:11,redName:`対ピンチ× (E〜G)`,blueName:`対ピンチ○/◎`,goldName:`強心臓`,category:`投手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`得点圏に走者を背負うと球速・変化量・制球が低下する。`,note:`特別指導の「投手」や特能の本で対ピンチ○/◎へ引き上げ消去。`},{id:12,redName:`チャンス× (E〜G)`,blueName:`チャンス○/◎`,goldName:`勝負師`,category:`野手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`得点圏に走者がいる時、ミート・パワーが落ちて凡退しやすくなる。`,note:`特別指導の「打撃」や合宿でチャンス○/◎を取得して上書き消去。`},{id:13,redName:`三振`,blueName:`粘り打ち`,goldName:`悪球打ち`,category:`野手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`2ストライク追い込まれるとミートカーソルが縮小し三振が増える。`,note:`「粘り打ち」を取得することで完全に打ち消し可能。`},{id:14,redName:`打たれ強さ× (E〜G)`,blueName:`打たれ強さ○/◎`,goldName:`不屈の魂`,category:`投手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`連打を浴びると動揺（ピヨリ状態）になりスタミナが激しく削られる。`,note:`特別指導の「投手」で打たれ強さ○を取得して消去。`},{id:15,redName:`対ランナー×`,blueName:`対ランナー○`,category:`投手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`一塁走者や一三塁走者を背負うと能力が低下する。`,note:`「対ランナー○」を取得することで解消できます。`},{id:16,redName:`ボール先行`,blueName:`ストライク先行`,category:`投手`,dangerLevel:`要注意`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`ボール球が先行しやすく、カウントを悪くして痛打されやすい。`,note:`「ストライク先行」を取得することで打ち消し可能。`},{id:17,redName:`対左投手× (E〜G)`,blueName:`対左投手○/◎`,goldName:`左キラー`,category:`野手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`相手が左投手の時、ミート・パワーが低下する。`,note:`特別指導「打撃」や本で対左投手○/◎へ強化して消去。`},{id:18,redName:`対左打者× (E〜G)`,blueName:`対左打者○/◎`,goldName:`左キラー`,category:`投手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`左打者と対峙した際、球速・制球・変化量が低下する。`,note:`特別指導「投手」や本で対左打者○/◎へ引き上げ。`},{id:19,redName:`ノビ× (E〜G)`,blueName:`ノビ○/◎`,goldName:`怪童`,category:`投手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`直球のノビ・体感速度が落ち、打者に捉えられやすくなる。`,note:`特別指導「投手」やノビ○/◎で打ち消し可能。`},{id:20,redName:`クイック× (E〜G)`,blueName:`クイック○/◎`,category:`投手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`投球モーションが遅く、相手に楽々と盗塁を決められてしまう。`,note:`特別指導「守備」等でクイック○/◎に昇格消去。`},{id:21,redName:`併殺`,blueName:`アベレージヒッター等`,category:`野手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`一塁走者がいる場面でゴロを打つとダブルプレー（併殺打）になりやすい。`,note:`チャンスを断ち切る赤特。安打製造系特能で単打・長打率を上げて克服。`},{id:22,redName:`盗塁× (E〜G)`,blueName:`盗塁○/◎`,goldName:`電光石火`,category:`野手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`盗塁時のスタートが極端に悪く、盗塁刺殺される確率が高い。`,note:`特別指導「走塁」で盗塁○へ改善可能。`},{id:23,redName:`走塁× (E〜G)`,blueName:`走塁○/◎`,goldName:`高速ベースラン`,category:`野手`,dangerLevel:`警戒`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`ベースランニングで減速し、好走塁や進塁ができない。`,note:`特別指導「走塁」で走塁○へ改善可能。`},{id:24,redName:`ケガしにくさ× (E〜G)`,blueName:`ケガしにくさ○/◎`,goldName:`鉄人`,category:`共通`,dangerLevel:`低`,specialGuide:!0,match:!0,book:!0,camp:!0,description:`練習や試合で怪我（捻挫・骨折等）を起こしやすくなる。`,note:`特別指導や特訓でケガしにくさ○/◎に改善可能。`},{id:25,redName:`チームプレイ×`,blueName:`チームプレイ○`,category:`野手`,dangerLevel:`低`,specialGuide:!1,match:!0,book:!0,camp:!0,description:`※特別指導では消去不可！合宿・試合・特能本でのみ対応可能。`,note:`自動操作中にバントをしづらくなる効果があるため、4番打者などクリーンナップなら消さずに残しても実質メリットになります！`}],dt=[{id:1,name:`安打製造機`,category:`野手`,type:`金特`,system:`三振 ➔ アベレージヒッター ➔ 安打製造機`,effect:`ミート打ち時のヒット性打球の確率が極めて大きく上昇する（アベレージヒッターの上位金特）。`,eikanTip:`栄冠ナインの自動失点・打撃で圧倒的な打率を叩き出す最強格の金特。転生OB・プロ（イチロー等）が所持。`,importance:`S`},{id:2,name:`アーチスト`,category:`野手`,type:`金特`,system:`パワーヒッター ➔ アーチスト`,effect:`強振時に打球の弾道が劇的に上がり、本塁打性の打球が極めて出やすくなる（パワーヒッターの上位金特）。`,eikanTip:`長打力・得点力が爆発的に向上。クリーンナップにつくと甲子園の勝率が跳ね上がる。`,importance:`S`},{id:3,name:`広角砲`,category:`野手`,type:`金特`,system:`広角打法 ➔ 広角砲`,effect:`流し方向への打球が失速せず、逆方向へもスタンドインする大本塁打を放てる（広角打法の上位金特）。`,eikanTip:`外角球を逆らわずにスタンドへ運べるため、変化球攻めを多用する強豪校相手に無類の強さを誇る。`,importance:`S`},{id:4,name:`高角砲`,category:`野手`,type:`金特`,system:`プルヒッター ➔ 高角砲`,effect:`引っ張り方向への打球の伸びと速度が凄まじく上昇する（プルヒッターの上位金特）。`,eikanTip:`甘い球を一撃でライト/レフトスタンドへ叩き込む。引っ張り傾向の強打者に最適。`,importance:`A`},{id:5,name:`勝負師`,category:`野手`,type:`金特`,system:`チャンス× ➔ チャンス○/◎ ➔ 勝負師`,effect:`得点圏に走者がいる場面で、ミートとパワーが驚異的に跳ね上がる（チャンスの上位金特）。`,eikanTip:`ランナーが出た好機で確実にタイムリー・本塁打を放つ。3〜5番打者に持たせたい最重要能力。`,importance:`S`},{id:6,name:`左キラー（野）`,category:`野手`,type:`金特`,system:`対左投手× ➔ 対左投手○/◎ ➔ 左キラー`,effect:`相手投手が左腕の時、ミートとパワーが極めて大きく上昇する。`,eikanTip:`左のエースを揃えてくる甲子園常連校を粉砕する切り札。`,importance:`A`},{id:7,name:`電光石火`,category:`野手`,type:`金特`,system:`盗塁× ➔ 盗塁○/◎ ➔ 電光石火`,effect:`盗塁時のスタート・加速が極限まで向上し、捕手の送球モーション前に次の塁へ到達する。`,eikanTip:`走力A以上の1・2番打者が持つと、単打が実質二塁打・三塁打化し、栄冠ナインの戦術「盗塁」がほぼ100%成功。`,importance:`S`},{id:8,name:`高速ベースラン`,category:`野手`,type:`金特`,system:`走塁× ➔ 走塁○/◎ ➔ 高速ベースラン`,effect:`塁間を回るスピードが格段に上がり、ベースランニングでスピードが全く落ちない。`,eikanTip:`長打コースで一気に本塁を陥れる。自動操作時の得点効率を底上げ。`,importance:`A`},{id:9,name:`ストライク送球`,category:`野手`,type:`金特`,system:`送球× ➔ 送球○/◎ ➔ ストライク送球`,effect:`捕球後の送球が一切ブレず、野手の胸元へ吸い込まれるような正確無比な送球になる。`,eikanTip:`栄冠ナイン最大の敗因の一つである「送球エラー・暴投」を完全にシャットアウト。二遊間・捕手に超推奨。`,importance:`S`},{id:10,name:`魔術師`,category:`野手`,type:`金特`,system:`守備職人 ➔ 魔術師`,effect:`守備時の捕球・送球・足さばきが極めて軽快になり、ヒット性の鋭いゴロや難しい打球を神技で処理する。`,eikanTip:`センターライン（二塁・遊撃）に持たせると内野安打やタイムリー性の当たりをアウトに激減させる。`,importance:`S`},{id:11,name:`高速レーザー`,category:`野手`,type:`金特`,system:`レーザービーム ➔ 高速レーザー`,effect:`外野からのバックホーム送球が地を這うような超低空ライナーでノーバウンド捕球される。`,eikanTip:`相手のタッチアップ・本塁突入をことごとく刺す。外野手の補殺数が爆増。`,importance:`A`},{id:12,name:`芸術的流し打ち`,category:`野手`,type:`金特`,system:`流し打ち ➔ 芸術的流し打ち`,effect:`逆方向への打球が全く失速せず、ライン際や野手の間を綺麗に抜ける長打になる。`,eikanTip:`アウトになりにくい巧打者を量産できる。アベレージヒッターとの相乗効果が抜群。`,importance:`A`},{id:13,name:`切り込み隊長`,category:`野手`,type:`金特`,system:`チャンスメーカー ➔ 切り込み隊長`,effect:`走者がいない場面（イニング先頭等）でミート・パワーが大きく上昇する。`,eikanTip:`1番打者に必須級の金特。イニング開始直後に出塁してビッグイニングの口火を切る。`,importance:`A`},{id:14,name:`恐怖の満塁男`,category:`野手`,type:`金特`,system:`満塁男 ➔ 恐怖の満塁男`,effect:`満塁の場面でミート・パワーが超絶上昇し、走者一掃の長打・本塁打の確率が最大化する。`,eikanTip:`栄冠ナインで発生しやすい満塁の勝負所で一気に試合を決定づける。`,importance:`A`},{id:15,name:`代打の神様`,category:`野手`,type:`金特`,system:`代打× ➔ 代打○ ➔ 代打の神様`,effect:`代打で起用された最初の打席で、ミート・パワーが驚異的に急上昇する。`,eikanTip:`ベンチに置いておくだけで終盤のビハインド時に逆転の切り札として絶大な安心感。`,importance:`A`},{id:16,name:`伝説のサヨナラ男`,category:`野手`,type:`金特`,system:`サヨナラ男 ➔ 伝説のサヨナラ男`,effect:`サヨナラのチャンスの場面で打撃能力が超大幅にアップする。`,eikanTip:`甲子園のサヨナラ勝ち演出や激戦を制する勝負強さの極み。`,importance:`B`},{id:17,name:`鉄人`,category:`野手`,type:`金特`,system:`ケガしにくさ× ➔ ケガしにくさ○/◎ ➔ 鉄人`,effect:`怪我や故障の発生率がゼロに近くなり、体力が極限まで保たれる。`,eikanTip:`栄冠ナインでの練習中の離脱事故を完全シャットアウト。`,importance:`B`},{id:18,name:`アベレージヒッター`,category:`野手`,type:`青特`,system:`三振 ➔ アベレージヒッター ➔ 安打製造機`,effect:`ミート打ち時に打球のバウンド・弾道がヒットになりやすい角度に補正される。`,eikanTip:`栄冠ナインで最も打率を安定させる超必須青特。ミート打ち指示での信頼度が段違い。`,importance:`S`},{id:19,name:`パワーヒッター`,category:`野手`,type:`青特`,system:`パワーヒッター ➔ アーチスト`,effect:`強振時に打球の角度が高くなり、本塁打が出やすくなる。`,eikanTip:`パワーB以上でこの特能があると、甲子園でも年間20〜30本塁打を量産する主砲に育つ。`,importance:`S`},{id:20,name:`広角打法`,category:`野手`,type:`青特`,system:`引っ張り屋 ➔ 広角打法 ➔ 広角砲`,effect:`流し方向（右打者なら右中間・ライト）へ強い打球が打てる。`,eikanTip:`外角の変化球にも強く、打球が野手の間を抜けて長打になりやすい。`,importance:`S`},{id:21,name:`プルヒッター`,category:`野手`,type:`青特`,system:`プルヒッター ➔ 高角砲`,effect:`引っ張り方向への打球速度が上がり、本塁打やライナー性のヒットが出やすくなる。`,eikanTip:`広角打法とは排他。強振引っ張りでスタンドに運ぶ長距離砲に向く。`,importance:`A`},{id:22,name:`流し打ち`,category:`野手`,type:`青特`,system:`流し打ち ➔ 芸術的流し打ち`,effect:`流し方向への打球がファールになりにくく、フェアゾーンに収まりやすい。`,eikanTip:`追い込まれてからの右打ち・進塁打や単打を安定して放つ巧打者の象徴。`,importance:`A`},{id:23,name:`粘り打ち`,category:`野手`,type:`青特`,system:`三振 ➔ 粘り打ち ➔ 悪球打ち`,effect:`2ストライク追い込まれてもミートカーソルが小さくならず、三振しにくくなる。`,eikanTip:`赤特「三振」を上書き消去できる。球数を投げさせて相手投手を早期降板に追い込める。`,importance:`A`},{id:24,name:`チャンス○/◎`,category:`野手`,type:`青特`,system:`チャンス× ➔ チャンス○/◎ ➔ 勝負師`,effect:`走者二塁・三塁・満塁の得点圏でミート・パワーがアップ（◎でさらに上昇）。`,eikanTip:`得点圏打率に直結。クリーンナップに最優先で付けたい能力。`,importance:`S`},{id:25,name:`対左投手○/◎`,category:`野手`,type:`青特`,system:`対左投手× ➔ 対左投手○/◎ ➔ 左キラー`,effect:`左投手に対してミート・パワーがアップ。`,eikanTip:`強豪校の左好投手を攻略するのに不可欠。`,importance:`A`},{id:26,name:`初球○`,category:`野手`,type:`青特`,system:`初球○`,effect:`カウント0ストライク時のミート・パワーがアップ。`,eikanTip:`自動進行時に初球打ちで安打になる確率が非常に高く、打率が大幅に向上する。`,importance:`A`},{id:27,name:`チャンスメーカー`,category:`野手`,type:`青特`,system:`チャンスメーカー ➔ 切り込み隊長`,effect:`走者がいない場面でミート・パワーが上昇。`,eikanTip:`1番打者・2番打者に最適。先頭打者出塁率を高めてビッグイニングを呼ぶ。`,importance:`A`},{id:28,name:`固め打ち`,category:`野手`,type:`青特`,system:`固め打ち ➔ マルチ安打`,effect:`1試合で2安打放った後、3安打目以降のミートが上昇。`,eikanTip:`猛打賞や大勝試合での大量得点を生み出す。`,importance:`B`},{id:29,name:`代打○`,category:`野手`,type:`青特`,system:`代打× ➔ 代打○ ➔ 代打の神様`,effect:`代打起用された打席でミート・パワーが上昇。`,eikanTip:`ベンチの控え野手に付けておくと終盤の勝負代打で大活躍する。`,importance:`A`},{id:30,name:`満塁男`,category:`野手`,type:`青特`,system:`満塁男 ➔ 恐怖の満塁男`,effect:`満塁時にミート・パワーが上昇。`,eikanTip:`下位打線でも満塁の好機に一発長打を狙える。`,importance:`B`},{id:31,name:`サヨナラ男`,category:`野手`,type:`青特`,system:`サヨナラ男 ➔ 伝説のサヨナラ男`,effect:`サヨナラのチャンスの場面でミート・パワーが大幅上昇。`,eikanTip:`劇的な逆転サヨナラ劇を呼び込む。`,importance:`B`},{id:32,name:`逆境○`,category:`野手`,type:`青特`,system:`逆境○`,effect:`7回以降に負けている場面でミート・パワーが上昇。`,eikanTip:`甲子園の魔物と合わさると、終盤の大逆転劇を生み出す。`,importance:`A`},{id:33,name:`内野安打○`,category:`野手`,type:`青特`,system:`内野安打○ ➔ ロケットスタート`,effect:`打った直後の走り出しが速くなり、内野安打のセーフ率がアップ。`,eikanTip:`走力B以上の打者が持つとボテボテの当たりでも出塁できるようになる。`,importance:`A`},{id:34,name:`バント○ / バント職人`,category:`野手`,type:`青特`,system:`バント× ➔ バント○ ➔ バント職人`,effect:`バント時の打球の勢いを殺し、絶妙な位置に転がせる（職人はセーフティバント成功率も上昇）。`,eikanTip:`送りバント指示での成功率が100%に近くなり、確実にランナーを進塁させられる。`,importance:`A`},{id:35,name:`守備職人`,category:`野手`,type:`青特`,system:`守備職人 ➔ 魔術師`,effect:`守備時の足の運びがスムーズになり、捕球後の送球動作も高速化する。`,eikanTip:`二遊間（セカンド・ショート）に必須。ダブルプレー（併殺）の完成率が段違い。`,importance:`S`},{id:36,name:`レーザービーム`,category:`野手`,type:`青特`,system:`レーザービーム ➔ 高速レーザー`,effect:`外野からのバックホーム・三塁送球が低空の鋭い弾道になり失速しない。`,eikanTip:`肩力B以上の外野手に持たせると、相手走者のタッチアップや生還を阻止できる。`,importance:`A`},{id:37,name:`送球○/◎`,category:`野手`,type:`青特`,system:`送球× ➔ 送球○/◎ ➔ ストライク送球`,effect:`送球時のコントロールが良くなり、悪送球やファンブルが激減する。`,eikanTip:`栄冠ナインで最も痛い失策（エラー）を防ぐ超重要守備特能。`,importance:`S`},{id:38,name:`盗塁○/◎`,category:`野手`,type:`青特`,system:`盗塁× ➔ 盗塁○/◎ ➔ 電光石火`,effect:`盗塁時のスタートダッシュが良くなり、捕手の送球をかいくぐって成功率アップ。`,eikanTip:`戦術「盗塁」の成功率が跳ね上がる。機動力野球の生命線。`,importance:`A`},{id:39,name:`走塁○/◎`,category:`野手`,type:`青特`,system:`走塁× ➔ 走塁○/◎ ➔ 高速ベースラン`,effect:`走塁時のコーナリングスピードが速くなり、長打時に先の塁へ進みやすくなる。`,eikanTip:`二塁打を三塁打にし、単打で一塁から三塁へ陥れる。`,importance:`B`},{id:40,name:`ヘッドスライディング`,category:`野手`,type:`青特`,system:`ヘッドスライディング ➔ 気迫ヘッド`,effect:`際どいタイミングで一塁または本塁に頭から滑り込み、セーフ判定を勝ち取る。`,eikanTip:`気迫のプレーで内野安打やクロスプレーのセーフ率がわずかに上昇。`,importance:`B`},{id:41,name:`いぶし銀`,category:`野手`,type:`青特`,system:`いぶし銀`,effect:`7回以降の同点または2点差以内の場面でミートが上昇し、単打が出やすくなる。`,eikanTip:`勝負どころで渋いタイムリーを放つベテラン・職人肌の選手に最適。`,importance:`B`},{id:42,name:`意外性`,category:`野手`,type:`青特`,system:`意外性 ➔ ミラクル男`,effect:`パワーD以下の選手が、5回以降の同点やビハインド時にパワーA相当の長打力を発揮する。`,eikanTip:`打撃能力が低い下位打線や捕手が突然ホームランを打つ奇跡を起こす。`,importance:`B`},{id:43,name:`威圧感（野）`,category:`野手`,type:`青特`,system:`威圧感（野）`,effect:`打席に立つだけで相手投手のコントロールを大幅に下げ、スタミナ消費を激増させる。`,eikanTip:`金特級の威力を持つ最強青特。相手投手が四球を連発し自滅する。`,importance:`S`},{id:44,name:`カット打ち`,category:`野手`,type:`青特`,system:`カット打ち`,effect:`2ストライク追い込まれてからファールを打ちやすくなる。`,eikanTip:`相手投手の球数を消費させてスタミナ切れに追い込む。`,importance:`B`},{id:45,name:`ラインドライブ`,category:`野手`,type:`青特`,system:`ラインドライブ`,effect:`強烈な低弾道ライナー性の打球を放ち、野手の間を抜く。`,eikanTip:`長打コースに抜けやすく、二塁打・三塁打が増える。`,importance:`B`},{id:46,name:`三振`,category:`野手`,type:`赤特`,system:`三振 ➔ 粘り打ち で打消し`,effect:`2ストライクに追い込まれるとミートカーソルが大幅に小さくなり、空振り三振しやすくなる。`,eikanTip:`自動操作時に三振が頻発し攻撃の流れを止める。「粘り打ち」で上書き消去可能。`,importance:`要注意`},{id:47,name:`チャンス×`,category:`野手`,type:`赤特`,system:`チャンス× (E〜G) ➔ チャンス○ で打消し`,effect:`得点圏に走者がいる時、ミート・パワーが低下する（Gで激減）。`,eikanTip:`好機で打てなくなる致命的な赤特。特別指導で最優先で消去したい。`,importance:`要注意`},{id:48,name:`対左投手×`,category:`野手`,type:`赤特`,system:`対左投手× (E〜G) ➔ 対左投手○ で打消し`,effect:`相手が左投手の時、ミート・パワーが低下する。`,eikanTip:`甲子園常連校の好左腕に手も足も出なくなるため、特訓や指導で底上げ推奨。`,importance:`要注意`},{id:49,name:`盗塁×`,category:`野手`,type:`赤特`,system:`盗塁× (E〜G) ➔ 盗塁○ で打消し`,effect:`盗塁時のスタートが遅れ、盗塁刺殺される確率が跳ね上がる。`,eikanTip:`走力が高くても盗塁指示を出せなくなる。特別指導や合宿で消去可能。`,importance:`要注意`},{id:50,name:`走塁×`,category:`野手`,type:`赤特`,system:`走塁× (E〜G) ➔ 走塁○ で打消し`,effect:`ベースランニングでスピードが落ち、次の塁を奪えなくなる。`,eikanTip:`二塁走者が単打で生還できなくなるなど得点効率が落ちる。`,importance:`要注意`},{id:51,name:`送球×`,category:`野手`,type:`赤特`,system:`送球× (E〜G) ➔ 送球○ で打消し`,effect:`送球コントロールが大きく乱れ、悪送球エラーを頻発する。`,eikanTip:`内野手・捕手にあると致命傷になる最危険守備赤特。特別指導で即消去すべき。`,importance:`最凶`},{id:52,name:`エラー`,category:`野手`,type:`赤特`,system:`エラー ➔ 守備職人 / 送球○ で打消し`,effect:`大事な場面やイージーゴロ・フライでファンブルや捕球ミスを犯す。`,eikanTip:`試合終盤の失点直結エラーの原因。捕球練習と特訓で早期克服が必要。`,importance:`最凶`},{id:53,name:`併殺`,category:`野手`,type:`赤特`,system:`併殺 ➔ アベレージヒッター等で解消`,effect:`走者一塁の場面でゴロを打つとゲッツー（併殺打）になる確率が激増する。`,eikanTip:`せっかくのチャンスをダブルプレーで潰す。強打者についている場合は要注意。`,importance:`要注意`},{id:54,name:`チームプレイ×`,category:`野手`,type:`赤特`,system:`チームプレイ× ➔ チームプレイ○ で打消し（※特別指導不可）`,effect:`自己中心的な打撃になり、自動操作時にバント指示に従わなくなる。`,eikanTip:`特別指導では消せないが、4番などクリーンナップならバントしない方が強いため実質メリットにもなる。`,importance:`B`},{id:55,name:`怪物球威`,category:`投手`,type:`金特`,system:`軽い球 ➔ 重い球 ➔ 怪物球威`,effect:`投球が驚異的に重くなり、打者のバットをへし折り打球を完全に詰まらせる。`,eikanTip:`被本塁打（被弾）が激減する最強の防御特能。甲子園の強打線相手でも長打を許さない。`,importance:`S`},{id:56,name:`本塁打厳禁`,category:`投手`,type:`金特`,system:`一発 ➔ 逃げ球 ➔ 本塁打厳禁`,effect:`失投したボールでも真ん中に入らず、被本塁打を極限まで防ぎきる。`,eikanTip:`栄冠ナイン最大の負けパターン「事故のような一発被弾」を完全撲滅できる。`,importance:`S`},{id:57,name:`怪童`,category:`投手`,type:`金特`,system:`ノビ× ➔ ノビ○/◎ ➔ 怪童`,effect:`直球（ストレート）の初速と終速の差が極限まで無くなり、手元でホップするような伸びを見せる。`,eikanTip:`直球中心の投球でも空振りを量産できるようになる。`,importance:`S`},{id:58,name:`強心臓`,category:`投手`,type:`金特`,system:`対ピンチ× ➔ 対ピンチ○/◎ ➔ 強心臓`,effect:`得点圏に走者を背負ったピンチで、球速・変化量・コントロールが超大幅にアップする。`,eikanTip:`ピンチを招いてもギアを上げて無失点に抑え込む。エース投手の絶対的守護神能力。`,importance:`S`},{id:59,name:`ドクターK`,category:`投手`,type:`金特`,system:`三振 ➔ 奪三振 ➔ ドクターK`,effect:`2ストライクに追い込むと球速・キレが急上昇し、打者が手を出せない空振りを奪う。`,eikanTip:`1試合15奪三振以上を連発。走者を置いた場面でもバットに当てさせず三振で仕留める。`,importance:`S`},{id:60,name:`不屈の魂`,category:`投手`,type:`金特`,system:`打たれ強さ× ➔ 打たれ強さ○/◎ ➔ 不屈の魂`,effect:`連打を浴びてもピヨリ状態（動揺）にならず、スタミナ消費も激減する。`,eikanTip:`ビッグイニングを作らせない。栄冠ナイン特有の「突然の炎上祭り」を阻止する。`,importance:`A`},{id:61,name:`驚異の切れ味`,category:`投手`,type:`金特`,system:`キレ× ➔ キレ○ ➔ 驚異の切れ味`,effect:`すべての変化球の曲がり始めが極限まで遅くなり、ベース直前で急激に鋭く変化する。`,eikanTip:`変化球中心の投手の空振り率・三振率が跳ね上がる。`,importance:`S`},{id:62,name:`変幻自在`,category:`投手`,type:`金特`,system:`緩急○ ➔ 変幻自在`,effect:`ストレートと遅い変化球を交互に投げ分けることで、打者の体感タイミングを完全に狂わせる。`,eikanTip:`球速が遅い技巧派投手でも強豪校打線をキリキリ舞いにできる。`,importance:`A`},{id:63,name:`精密機械`,category:`投手`,type:`金特`,system:`低め○ / コントロール○ ➔ 精密機械`,effect:`針の穴を通すような正確無比な制球力を誇り、コースギリギリの四隅へ投げ分けられる。`,eikanTip:`甘いコースへの失投がゼロになり、四球での自滅も根絶される。`,importance:`A`},{id:64,name:`終盤の鬼`,category:`投手`,type:`金特`,system:`寸前× ➔ 尻上がり ➔ 終盤の鬼`,effect:`先発時、6回以降の終盤イニングで球速・キレ・制球が凄まじく向上する。`,eikanTip:`終盤の相手の猛反撃をシャットアウトし、完投勝利を確実に掴む。`,importance:`A`},{id:65,name:`勝利の星`,category:`投手`,type:`金特`,system:`負け運 ➔ 勝ち運 ➔ 勝利の星`,effect:`マウンドに立っている間、味方野手全員のミート・パワー・勝負強さが大幅に引き上げられる。`,eikanTip:`投手が好投するだけでなく打線が援護点を爆発させる。チーム全体の勝率が直結して上昇。`,importance:`S`},{id:66,name:`快速立ち上がり`,category:`投手`,type:`金特`,system:`スロースターター ➔ 立ち上がり○ ➔ 快速立ち上がり`,effect:`試合開始直後の1〜2回、投手の能力が全開となり完璧な立ち上がりを見せる。`,eikanTip:`栄冠ナインで最も失点しやすい「試合序盤の事故失点」を完封する。`,importance:`A`},{id:67,name:`鉄腕`,category:`投手`,type:`金特`,system:`回復× ➔ 回復○/◎ ➔ 鉄腕`,effect:`登板後のスタミナ回復が劇的に早く、連投しても疲労が全くたまらない。`,eikanTip:`夏の甲子園など過密日程でエース投手をフル回転させられる。`,importance:`A`},{id:68,name:`重い球`,category:`投手`,type:`青特`,system:`軽い球 ➔ 重い球 ➔ 怪物球威`,effect:`投球が重くなり、バットに当たっても打球が失速して外野フライやゴロになる。`,eikanTip:`赤特「軽い球」を打消し可能。被本塁打を減らす最重要青特の一つ。`,importance:`S`},{id:69,name:`逃げ球`,category:`投手`,type:`青特`,system:`一発 ➔ 逃げ球 ➔ 本塁打厳禁`,effect:`失投時に真ん中にボールが集まりにくくなり、痛打を防ぐ。`,eikanTip:`最悪の赤特「一発」を上書き消去できる。エース育成の必須科目。`,importance:`S`},{id:70,name:`ノビ○/◎`,category:`投手`,type:`青特`,system:`ノビ× ➔ ノビ○/◎ ➔ 怪童`,effect:`直球の体感速度と伸びが向上し、差し込まれやすくなる。`,eikanTip:`直球の空振り率が上がり、ストライク先行の投球ができる。`,importance:`A`},{id:71,name:`キレ○`,category:`投手`,type:`青特`,system:`キレ× ➔ キレ○ ➔ 驚異の切れ味`,effect:`変化球の変化のキレが鋭くなり、打者がボールを見極めづらくなる。`,eikanTip:`変化球を主武器にする投手には不可欠。`,importance:`A`},{id:72,name:`奪三振`,category:`投手`,type:`青特`,system:`三振 ➔ 奪三振 ➔ ドクターK`,effect:`2ストライクに追い込むと球速・変化量がアップし三振を取りやすくなる。`,eikanTip:`ランナーを背負った場面で三振を狙える。戦術「三振狙い」の成功率が向上。`,importance:`A`},{id:73,name:`対ピンチ○/◎`,category:`投手`,type:`青特`,system:`対ピンチ× ➔ 対ピンチ○/◎ ➔ 強心臓`,effect:`得点圏に走者を置いた場面で能力が向上。`,eikanTip:`得点圏での被打率を抑え、失点を防ぐ。`,importance:`S`},{id:74,name:`打たれ強さ○/◎`,category:`投手`,type:`青特`,system:`打たれ強さ× ➔ 打たれ強さ○/◎ ➔ 不屈の魂`,effect:`連打を浴びてもピヨリ状態になりにくくなる。`,eikanTip:`相手の連打による大量失点ビッグイニングを防ぐ。`,importance:`A`},{id:75,name:`勝ち運`,category:`投手`,type:`青特`,system:`負け運 ➔ 勝ち運 ➔ 勝利の星`,effect:`マウンドにいる間、味方打線全員のパワーがアップする。`,eikanTip:`赤特「負け運」を打消し。打線の大量援護を呼び込む神スキル。`,importance:`S`},{id:76,name:`立ち上がり○`,category:`投手`,type:`青特`,system:`スロースターター ➔ 立ち上がり○ ➔ 快速立ち上がり`,effect:`試合開始1〜2回の能力が向上する。`,eikanTip:`赤特「スロースターター」を上書き消去。初回失点癖を直す。`,importance:`A`},{id:77,name:`尻上がり`,category:`投手`,type:`青特`,system:`寸前× ➔ 尻上がり ➔ 終盤の鬼`,effect:`先発投手の能力が7回以降アップする。`,eikanTip:`終盤の接戦で相手打線を抑え込む。`,importance:`A`},{id:78,name:`ストライク先行`,category:`投手`,type:`青特`,system:`ボール先行 ➔ ストライク先行`,effect:`初球やカウント不利になってもストライクを入れやすくなる。`,eikanTip:`赤特「ボール先行」を打消し。四球自滅を防止。`,importance:`B`},{id:79,name:`緩急○`,category:`投手`,type:`青特`,system:`緩急○ ➔ 変幻自在`,effect:`ストレートと遅い変化球を織り交ぜることで打者のタイミングを外す。`,eikanTip:`チェンジアップやカーブを持つ投手と相性抜群。`,importance:`A`},{id:80,name:`球持ち○`,category:`投手`,type:`青特`,system:`球持ち○ ➔ 精密機械`,effect:`リリースポイントが打者から見えにくくなり体感球速が上がる。`,eikanTip:`空振りを奪いやすく、見逃しストライクも増える。`,importance:`A`},{id:81,name:`低め○`,category:`投手`,type:`青特`,system:`低め○ ➔ 低め必中`,effect:`低めゾーンへの投球精度が上がり、打たれても内野ゴロになりやすい。`,eikanTip:`ゴロ併殺を狙う投球スタイルに最適。`,importance:`A`},{id:82,name:`内角攻め`,category:`投手`,type:`青特`,system:`内角攻め ➔ 内角無双`,effect:`打者のインコースへ投げた時に球威が増し、詰まらせやすくなる。`,eikanTip:`クロスファイヤーと組み合わせると無敵の内角球になる。`,importance:`A`},{id:83,name:`威圧感（投）`,category:`投手`,type:`青特`,system:`威圧感（投）`,effect:`リリーフ（救援）登板時、相手打者全員のミート・パワーを大きく下げ、スタミナ消費を倍増させる。`,eikanTip:`金特をも凌駕する栄冠ナイン最強のリリーフ能力。守護神・抑えに持たせると勝利確定。`,importance:`S`},{id:84,name:`クロスファイヤー`,category:`投手`,type:`青特`,system:`クロスファイヤー`,effect:`対角線上のコース（右投手の外角低め、左投手の内角等）への投球威力とキレがアップ。`,eikanTip:`見逃し三振や凡打を量産する実践的青特。`,importance:`A`},{id:85,name:`ジャイロボール`,category:`投手`,type:`青特`,system:`ジャイロボール`,effect:`直球にジャイロ回転がかかり、手元で急激に浮き上がるように伸びる。`,eikanTip:`ストレートで空振りを奪える爽快な特能。`,importance:`B`},{id:86,name:`牽制○`,category:`投手`,type:`青特`,system:`牽制× ➔ 牽制○`,effect:`牽制モーションが素早くなり、走者の盗塁を抑止する。`,eikanTip:`機動力の高いチームの盗塁を封殺。`,importance:`B`},{id:87,name:`打球反応○`,category:`投手`,type:`青特`,system:`打球反応× ➔ 打球反応○`,effect:`ピッチャー直撃の強烈な打球に対して素早く反応して好捕する。`,eikanTip:`ピッチャー返しのセンター前ヒットをアウトにする。`,importance:`B`},{id:88,name:`投打躍動`,category:`投手`,type:`青特`,system:`投打躍動`,effect:`好投していると打席でのミート・パワーが上がり、安打を打つと投球能力も上がる。`,eikanTip:`二刀流選手や打てる投手の能力を極限まで引き上げる。`,importance:`A`},{id:89,name:`緊急登板○`,category:`投手`,type:`青特`,system:`緊急登板○`,effect:`前投手の怪我や突然のノックアウトによる緊急救援時に好調な状態で登板できる。`,eikanTip:`リリーフ陣の保険として優秀。`,importance:`B`},{id:90,name:`火消し`,category:`投手`,type:`青特`,system:`火消し`,effect:`イニング途中のピンチ（走者を背負った場面）で救援登板した時、能力が大幅アップ。`,eikanTip:`中継ぎ投手に必須級のピンチ脱出特能。`,importance:`A`},{id:91,name:`一発`,category:`投手`,type:`赤特`,system:`一発 ➔ 逃げ球 で打消し`,effect:`失投時にボールが真ん中に入り、本塁打を被弾する確率が跳ね上がる。`,eikanTip:`栄冠ナインで最も警戒すべき凶悪赤特。接戦で一発被弾して敗退する主因。「逃げ球」で消去必須。`,importance:`最凶`},{id:92,name:`軽い球`,category:`投手`,type:`赤特`,system:`軽い球 ➔ 重い球 で打消し`,effect:`投球が軽く、打球がどこまでも伸びて長打・本塁打になりやすくなる。`,eikanTip:`球速があってもスタンドに運ばれる危険能力。「重い球」で上書き消去必須。`,importance:`最凶`},{id:93,name:`負け運`,category:`投手`,type:`赤特`,system:`負け運 ➔ 勝ち運 で打消し`,effect:`登板中、味方打線全体のパワーが下がり、得点力が大幅に落ちる。`,eikanTip:`投手が無失点で抑えても打線が沈黙して0-1で負ける典型例。「勝ち運」で打消し。`,importance:`最凶`},{id:94,name:`スロースターター`,category:`投手`,type:`赤特`,system:`スロースターター ➔ 立ち上がり○ で打消し`,effect:`試合開始直後の1〜2回に球速・制球が低下し、失点しやすくなる。`,eikanTip:`初回にいきなり3点取られてゲームプランが崩壊する元凶。「立ち上がり○」で打消し。`,importance:`要注意`},{id:95,name:`対ランナー×`,category:`投手`,type:`赤特`,system:`対ランナー× ➔ 対ランナー○ で打消し`,effect:`走者一塁、または一・三塁でコントロールや球速が低下する。`,eikanTip:`単打を許した後に崩れて連打を浴びる。「対ランナー○」で打消し。`,importance:`要注意`},{id:96,name:`ボール先行`,category:`投手`,type:`赤特`,system:`ボール先行 ➔ ストライク先行 で打消し`,effect:`カウントが悪くなりやすく、ボール球を連発してカウントを崩す。`,eikanTip:`球数が増えてスタミナが枯渇し四球連発につながる。「ストライク先行」で打消し。`,importance:`要注意`},{id:97,name:`四球`,category:`投手`,type:`赤特`,system:`四球 ➔ コントロール特訓で消去`,effect:`カウント3ボールになるとコントロールが急激に悪化し、押し出し四球などを連発する。`,eikanTip:`失点に直結する危険な赤特。特訓や特別指導での消去推奨。`,importance:`最凶`},{id:98,name:`乱調`,category:`投手`,type:`赤特`,system:`乱調 ➔ 調子安定等で解消`,effect:`試合中の特定のイニングで突然コントロールを乱し、大炎上する。`,eikanTip:`先発投手が突然崩れる原因。早期リリーフ継投の判断が必要。`,importance:`最凶`},{id:99,name:`寸前×`,category:`投手`,type:`赤特`,system:`寸前× ➔ 尻上がり で打消し`,effect:`5回や9回など、勝利目前のイニングで突然能力が低下し痛打を浴びる。`,eikanTip:`9回2アウトからサヨナラ負けを食らう悪夢の赤特。「尻上がり」で解消可能。`,importance:`最凶`},{id:100,name:`力配分`,category:`投手`,type:`緑特`,system:`力配分`,effect:`相手の下位打線（7〜9番）相手にスタミナを温存し
